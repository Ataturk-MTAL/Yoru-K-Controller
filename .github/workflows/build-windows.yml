name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Windows x86-64 (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # usls/ort build artifacts ve indirilen binary'leri önbellekle
          cache-on-failure: true

      - name: Build (release)
        run: cargo build --release
        env:
          # ort download-binaries için gerekli (proxy olmayan ortamlarda varsayılan çalışır)
          ORT_STRATEGY: download

      - name: Run tests
        run: cargo test --workspace --exclude app
        # app crate kamera/UI donanımı gerektirdiğinden CI'da hariç tutulur

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoru-k-controller-windows
          path: |
            target/release/app.exe
          retention-days: 7
