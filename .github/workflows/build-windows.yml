name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64 (MSVC)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: target/release/app.exe
            artifact_name: yoru-k-controller-windows.exe

          - name: Linux x86-64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: target/release/app
            artifact_name: yoru-k-controller-linux

          - name: macOS ARM64 (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: target/release/app
            artifact_name: yoru-k-controller-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libv4l-dev \
            libudev-dev \
            libssl-dev \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgles2-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Build (release)
        run: cargo build --release
        env:
          ORT_STRATEGY: download

      - name: Run tests
        run: cargo test --workspace --exclude app
        env:
          ORT_STRATEGY: download

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: copy target\release\app.exe yoru-k-controller-windows.exe

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: cp ${{ matrix.artifact }} ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 7

  release-beta:
    name: Beta Release (main push)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Beta (latest main)
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            Bu build otomatik oluşturulmuştur — `main` branch'inin en son hali.
            Stabil sürüm için versiyonlu release'lere bakın.
          files: |
            artifacts/yoru-k-controller-windows.exe/yoru-k-controller-windows.exe
            artifacts/yoru-k-controller-linux/yoru-k-controller-linux
            artifacts/yoru-k-controller-macos-arm64/yoru-k-controller-macos-arm64

  release-stable:
    name: Stable Release (tag push)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create stable release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/yoru-k-controller-windows.exe/yoru-k-controller-windows.exe
            artifacts/yoru-k-controller-linux/yoru-k-controller-linux
            artifacts/yoru-k-controller-macos-arm64/yoru-k-controller-macos-arm64
