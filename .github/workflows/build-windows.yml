name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64 (MSVC)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: yoru-k-controller-windows.exe

          - name: Linux x86-64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: yoru-k-controller-linux.AppImage

          - name: macOS ARM64 (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: yoru-k-controller-macos-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libv4l-dev \
            libudev-dev \
            libssl-dev \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgles2-mesa-dev \
            ninja-build \
            librsvg2-bin

      - name: Install Ninja (Windows — Skia build gereksinimi)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Her run benzersiz key kaydeder (run_id), sonraki run restore-keys
      # ile en yakın cache'i bulur → sadece değişen crate'ler derlenir.
      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-${{ matrix.target }}-

      - name: Build (release)
        run: cargo build --release
        env:
          ORT_STRATEGY: download

      - name: Run tests
        run: cargo test --workspace --exclude app
        env:
          ORT_STRATEGY: download

      # ── Windows: doğrudan .exe ──────────────────────────────────────────
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: copy target\release\app.exe yoru-k-controller-windows.exe

      # ── Linux: AppImage ─────────────────────────────────────────────────
      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          # linuxdeploy indir
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # AppDir yapısı — .desktop usr/share/applications/ altında olmalı
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp target/release/app AppDir/usr/bin/yoru-k-controller

          # SVG → 256x256 PNG ikon
          rsvg-convert -w 256 -h 256 "crates/app/assets/Yörü-K-1.svg" \
            -o AppDir/usr/share/icons/hicolor/256x256/apps/yoru-k-controller.png

          # .desktop — heredoc YAML'ı bozduğundan printf kullan
          printf '[Desktop Entry]\nName=Yoru-K Controller\nExec=yoru-k-controller\nIcon=yoru-k-controller\nType=Application\nCategories=Utility;\n' \
            > AppDir/usr/share/applications/yoru-k-controller.desktop

          # AppImage oluştur (FUSE3 olmadan extracted mod)
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --output appimage

          # Türkçe karakter içerebileceğinden find ile bul
          APPIMAGE_FILE=$(find . -maxdepth 1 -name "*.AppImage" | head -1)
          mv "$APPIMAGE_FILE" yoru-k-controller-linux.AppImage

      # ── macOS: .app bundle → .tar.gz ───────────────────────────────────
      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        run: |
          APP="Yörü-K Controller.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp target/release/app "$APP/Contents/MacOS/Yörü-K Controller"

          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Yörü-K Controller</string>
            <key>CFBundleDisplayName</key>
            <string>Yörü-K Controller</string>
            <key>CFBundleExecutable</key>
            <string>Yörü-K Controller</string>
            <key>CFBundleIdentifier</key>
            <string>com.ataturk.yoru-k-controller</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSCameraUsageDescription</key>
            <string>Robot kamera görüntüsü için kamera erişimi gereklidir.</string>
          </dict>
          </plist>
          PLIST

          tar czf yoru-k-controller-macos-arm64.tar.gz "$APP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 7

  release-beta:
    name: Beta Release (main push)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Beta (latest main)
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            Bu build otomatik oluşturulmuştur — `main` branch'inin en son hali.
            Stabil sürüm için versiyonlu release'lere bakın.

            **Kurulum:**
            - **Windows:** `yoru-k-controller-windows.exe` indirip çalıştırın
            - **Linux:** `chmod +x yoru-k-controller-linux.AppImage` → çalıştırın
            - **macOS:** `tar xzf yoru-k-controller-macos-arm64.tar.gz` → `.app`'i Applications'a taşıyın
          files: |
            artifacts/yoru-k-controller-windows.exe/yoru-k-controller-windows.exe
            artifacts/yoru-k-controller-linux.AppImage/yoru-k-controller-linux.AppImage
            artifacts/yoru-k-controller-macos-arm64.tar.gz/yoru-k-controller-macos-arm64.tar.gz

  release-stable:
    name: Stable Release (tag push)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create stable release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/yoru-k-controller-windows.exe/yoru-k-controller-windows.exe
            artifacts/yoru-k-controller-linux.AppImage/yoru-k-controller-linux.AppImage
            artifacts/yoru-k-controller-macos-arm64.tar.gz/yoru-k-controller-macos-arm64.tar.gz
