name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64 (MSVC)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: target/release/app.exe
            artifact_name: yoru-k-controller-windows

          - name: Linux x86-64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: target/release/app
            artifact_name: yoru-k-controller-linux

          - name: macOS ARM64 (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: target/release/app
            artifact_name: yoru-k-controller-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libv4l-dev \
            libudev-dev \
            libssl-dev \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgles2-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Build (release)
        run: cargo build --release
        env:
          ORT_STRATEGY: download

      - name: Run tests
        run: cargo test --workspace --exclude app
        env:
          ORT_STRATEGY: download

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact }}
          retention-days: 7
