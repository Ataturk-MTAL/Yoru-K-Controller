[workspace]
members = ["crates/protocol", "crates/transport", "crates/control", "crates/vision", "crates/app"]
resolver = "2"

[workspace.dependencies]
# UI
slint       = "1.15.1"
slint-build = "1.15.1"

# Async
tokio = { version = "1.41", features = ["full"] }

# Serial
serialport = "4.6"

# Kamera (pure Rust, AVFoundation on macOS)
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"] }

# ONNX Runtime (prebuilt binary — kurulum gerekmez)
ort = { version = "2.0.0-rc.11", features = ["download-binaries"] }

# Görüntü işleme
image              = "0.25"
imageproc          = "0.26.0"
ab_glyph           = "0.2"
ndarray            = "0.17.2"
fast_image_resize  = { version = "6", features = ["image"] }

# HTTP (Faz 2: harita tile)
reqwest = { version = "0.13.2", features = ["blocking"] }

# Loglama
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hata yönetimi
anyhow    = "1"
thiserror = "2"
